<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe Web OS - Test Runner</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background: #1a1a1a;
      color: #e6e6e6;
    }
    .test-suite {
      margin: 20px 0;
      padding: 15px;
      background: #2a2a2a;
      border-radius: 8px;
    }
    .test-suite h2 {
      margin-top: 0;
      color: #4f7cff;
    }
    .test {
      margin: 10px 0;
      padding: 10px;
      background: #333;
      border-radius: 4px;
      border-left: 3px solid #666;
    }
    .test.pass {
      border-left-color: #2ec27e;
    }
    .test.fail {
      border-left-color: #ff6b6b;
    }
    .test-name {
      font-weight: bold;
      margin-bottom: 5px;
    }
    .test-error {
      color: #ff6b6b;
      font-family: monospace;
      font-size: 12px;
      margin-top: 5px;
    }
    .summary {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px;
      background: #2a2a2a;
      border-radius: 8px;
      min-width: 200px;
    }
    .summary h3 {
      margin-top: 0;
    }
    .stat {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
    }
    .stat.pass { color: #2ec27e; }
    .stat.fail { color: #ff6b6b; }
    button {
      background: #4f7cff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 5px;
    }
    button:hover {
      background: #3d6bff;
    }
  </style>
</head>
<body>
  <h1>🧪 Vibe Web OS Test Runner</h1>
  
  <div class="summary" id="summary">
    <h3>Test Summary</h3>
    <div class="stat">
      <span>Total:</span>
      <span id="total">0</span>
    </div>
    <div class="stat pass">
      <span>Passed:</span>
      <span id="passed">0</span>
    </div>
    <div class="stat fail">
      <span>Failed:</span>
      <span id="failed">0</span>
    </div>
    <button onclick="runAllTests()">Run All Tests</button>
  </div>

  <div id="test-results"></div>

  <script type="module">
    // Simple test framework
    const TestRunner = {
      suites: [],
      currentSuite: null,
      results: { total: 0, passed: 0, failed: 0 },
      
      describe(name, fn) {
        this.currentSuite = { name, tests: [], beforeEach: [] };
        this.suites.push(this.currentSuite);
        fn();
        this.currentSuite = null;
      },
      
      beforeEach(fn) {
        if (!this.currentSuite) {
          this.currentSuite = { name: 'Unnamed Suite', tests: [], beforeEach: [] };
          this.suites.push(this.currentSuite);
        }
        this.currentSuite.beforeEach.push(fn);
      },
      
      it(name, fn) {
        if (!this.currentSuite) {
          this.currentSuite = { name: 'Unnamed Suite', tests: [], beforeEach: [] };
          this.suites.push(this.currentSuite);
        }
        this.currentSuite.tests.push({ name, fn });
      },
      
      expect(actual) {
        return {
          toEqual(expected) {
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              throw new Error(`Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
            }
          },
          toBe(expected) {
            if (actual !== expected) {
              throw new Error(`Expected ${expected}, got ${actual}`);
            }
          },
          toBeTruthy() {
            if (!actual) {
              throw new Error(`Expected truthy value, got ${actual}`);
            }
          },
          toBeFalsy() {
            if (actual) {
              throw new Error(`Expected falsy value, got ${actual}`);
            }
          },
          toBeGreaterThan(expected) {
            if (actual <= expected) {
              throw new Error(`Expected ${actual} to be greater than ${expected}`);
            }
          },
          toBeLessThan(expected) {
            if (actual >= expected) {
              throw new Error(`Expected ${actual} to be less than ${expected}`);
            }
          },
          toBeGreaterThanOrEqual(expected) {
            if (actual < expected) {
              throw new Error(`Expected ${actual} to be greater than or equal to ${expected}`);
            }
          },
          toBeLessThanOrEqual(expected) {
            if (actual > expected) {
              throw new Error(`Expected ${actual} to be less than or equal to ${expected}`);
            }
          },
          toContain(expected) {
            if (Array.isArray(actual)) {
              if (!actual.includes(expected)) {
                throw new Error(`Expected array to contain ${expected}`);
              }
            } else if (typeof actual === 'string') {
              if (!actual.includes(expected)) {
                throw new Error(`Expected string to contain "${expected}"`);
              }
            } else {
              throw new Error(`toContain can only be used with arrays or strings`);
            }
          },
          toHaveLength(expected) {
            if (actual.length !== expected) {
              throw new Error(`Expected length ${expected}, got ${actual.length}`);
            }
          },
          toBeDefined() {
            if (actual === undefined) {
              throw new Error(`Expected value to be defined, got undefined`);
            }
          },
          toBeUndefined() {
            if (actual !== undefined) {
              throw new Error(`Expected value to be undefined, got ${actual}`);
            }
          },
          toHaveProperty(property) {
            if (actual === null || actual === undefined) {
              throw new Error(`Cannot check property on ${actual}`);
            }
            if (!(property in actual)) {
              throw new Error(`Expected object to have property "${property}"`);
            }
          },
          toBeNull() {
            if (actual !== null) {
              throw new Error(`Expected null, got ${actual}`);
            }
          },
          toBeNullish() {
            if (actual !== null && actual !== undefined) {
              throw new Error(`Expected null or undefined, got ${actual}`);
            }
          }
        };
      },
      
      // Helper for testing exceptions
      toThrow(fn, expectedMessage) {
        try {
          fn();
          throw new Error('Expected function to throw an error');
        } catch (error) {
          if (expectedMessage && !error.message.includes(expectedMessage)) {
            throw new Error(`Expected error message to contain "${expectedMessage}", got "${error.message}"`);
          }
        }
      },
      
      async run() {
        this.results = { total: 0, passed: 0, failed: 0 };
        const container = document.getElementById('test-results');
        container.innerHTML = '';
        
        for (const suite of this.suites) {
          const suiteDiv = document.createElement('div');
          suiteDiv.className = 'test-suite';
          suiteDiv.innerHTML = `<h2>${suite.name}</h2>`;
          container.appendChild(suiteDiv);
          
          for (const test of suite.tests) {
            this.results.total++;
            const testDiv = document.createElement('div');
            testDiv.className = 'test';
            testDiv.innerHTML = `<div class="test-name">${test.name}</div>`;
            suiteDiv.appendChild(testDiv);
            
            try {
              // Run beforeEach hooks
              for (const hook of suite.beforeEach) {
                await hook();
              }
              // Run the test
              await test.fn();
              testDiv.classList.add('pass');
              this.results.passed++;
            } catch (error) {
              testDiv.classList.add('fail');
              testDiv.innerHTML += `<div class="test-error">${error.message}</div>`;
              this.results.failed++;
            }
          }
        }
        
        this.updateSummary();
      },
      
      updateSummary() {
        document.getElementById('total').textContent = this.results.total;
        document.getElementById('passed').textContent = this.results.passed;
        document.getElementById('failed').textContent = this.results.failed;
      }
    };
    
    window.TestRunner = TestRunner;
    window.expect = TestRunner.expect.bind(TestRunner);
    window.describe = TestRunner.describe.bind(TestRunner);
    window.it = TestRunner.it.bind(TestRunner);
    window.beforeEach = TestRunner.beforeEach.bind(TestRunner);
    window.runAllTests = () => TestRunner.run();
    
    // Load test files
    async function loadTests() {
      // Load all test files
      // IMPORTANT: i18n.browser.test.js must load BEFORE core.apps.browser.test.js
      // because core.apps creates a minimal I18n mock that would overwrite the full mock
      await import('./core.bus.browser.test.js');
      await import('./core.fs.browser.test.js');
      await import('./i18n.browser.test.js');  // Load BEFORE core.apps
      await import('./core.apps.browser.test.js');
      await import('./core.window.browser.test.js');
      await import('./core.folders.browser.test.js');
      await import('./core.filesave.browser.test.js');
      // Tests will register themselves, now run them
      await TestRunner.run();
    }
    
    // Wait for DOM to be ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadTests);
    } else {
      loadTests().catch(console.error);
    }
  </script>
</body>
</html>
