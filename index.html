
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vibe Web OS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/os.css" />
</head>
<body>
  <!-- Boot Screen -->
  <div id="boot-screen">
    <div class="logo">web<span>OS</span></div>
    <div class="progress"><div class="bar"></div></div>
    <div class="hint">Starting services…</div>
  </div>

  <!-- Desktop -->
  <div id="desktop" aria-label="Desktop" role="application" hidden>
    <div id="desktop-icons" role="menubar" aria-label="Desktop Icons">
      <button class="icon" data-app="sysinfo">
        <span class="icon-glyph">💻</span>
        <span class="icon-label">System Information</span>
      </button>
      <button class="icon" data-app="files">
        <span class="icon-glyph">📁</span>
        <span class="icon-label">Files</span>
      </button>
      <button class="icon" data-app="notes">
        <span class="icon-glyph">📝</span>
        <span class="icon-label">Notes</span>
      </button>
      <button class="icon" data-app="settings">
        <span class="icon-glyph">⚙️</span>
        <span class="icon-label">Settings</span>
      </button>
      <button class="icon" data-app="editor">
        <span class="icon-glyph">📄</span>
        <span class="icon-label">Text Editor</span>
      </button>
      <button class="icon" data-app="games-folder">
        <span class="icon-glyph">🎮</span>
        <span class="icon-label">Games</span>
      </button>
      <button class="icon" data-app="browser">
        <span class="icon-glyph">🌐</span>
        <span class="icon-label">PageNotFound<br>Explorer</span>
      </button>
      <button class="icon" data-app="draw">
        <span class="icon-glyph">🎨</span>
        <span class="icon-label">Draw</span>
      </button>
    </div>
    
    <!-- Desktop Items (from /root/Desktop folder) -->
    <div id="desktop-items" role="menubar" aria-label="Desktop Items"></div>

    <!-- Window Layer -->
    <div id="window-layer" aria-live="polite"></div>

    <!-- Taskbar -->
    <div id="taskbar" role="toolbar" aria-label="Taskbar">
      <button id="btn-start" aria-haspopup="true" aria-controls="start-menu">
        <span class="start-logo">web</span><span class="start-logo-accent">OS</span>
      </button>
      <input id="taskbar-search" type="text" placeholder="Type here to search" aria-label="Search" autocomplete="off" />
      <div id="task-list" aria-label="Open Windows"></div>
      <div id="task-clock-container">
        <div id="task-network" role="status" aria-label="Network Status" title="Online"></div>
        <div id="task-locale" role="button" aria-haspopup="true" aria-label="Language"></div>
        <div id="task-clock" aria-live="polite">
          <div id="task-clock-time"></div>
          <div id="task-clock-date"></div>
        </div>
      </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu" role="menu" aria-hidden="true">
      <div class="start-title">Start</div>
      <div class="start-auth-actions" id="start-auth-actions"></div>
      <div class="start-apps" id="start-apps"></div>
    </div>
  </div>

  <script src="js/core.bus.js"></script>
  <script src="js/core.error.js"></script>
  <script src="js/version.js"></script>
  <script src="js/i18n/core.js"></script>
  <script src="js/i18n/en.js"></script>
  <script src="js/i18n/de.js"></script>
  <script src="js/i18n/fr.js"></script>
  <script src="js/i18n/es.js"></script>
  <script src="js/i18n/it.js"></script>
  <script src="js/i18n/pt.js"></script>
  <script src="js/i18n/ru.js"></script>
  <script src="js/i18n/ar.js"></script>
  <script src="js/i18n/ja.js"></script>
  <script src="js/i18n/zh.js"></script>
  <script src="js/i18n/ko.js"></script>
  <script src="js/core.fs.js"></script>
  <script src="js/core.filepreview.js"></script>
  <script src="js/core.filebrowser.js"></script>
  <script src="js/core.filesave.js"></script>
  <script src="js/core.window.js"></script>
  <script src="js/core.dialog.js"></script>
  <script src="js/core.apps.js"></script>
  <script src="js/core.folders.js"></script>
  <script src="js/core.shell.js"></script>
  <script src="js/core.state.js"></script>
  <script src="js/core.auth.js"></script>
  <script src="js/core.auth.ui.js"></script>
  <script src="js/apps/notes.js"></script>
  <script src="js/apps/editor.js"></script>
  <script src="js/apps/files.js"></script>
  <script src="js/apps/settings.js"></script>
  <script src="js/apps/browser.js"></script>
  <script src="js/apps/datetime.js"></script>
  <script src="js/apps/calculator.js"></script>
  <script src="js/apps/draw.js"></script>
  <script src="js/apps/terminal.js"></script>
  <script src="js/apps/sysinfo.js"></script>
  <script src="js/apps/test.js"></script>
  <script src="js/apps/taskmanager.js"></script>
  <script src="js/games/folder.js"></script>
  <script src="js/games/minesweeper.js"></script>
  <script src="js/bsod.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
